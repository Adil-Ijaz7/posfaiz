    <script>
      /* Ensure window.fetch has a setter to avoid "Cannot set property fetch of #<Window> which has only a getter" */
      (function() {
        // Intercept Object.defineProperty so any script defining a getter on 'fetch' automatically gets a setter
        var origDefineProperty = Object.defineProperty;
        try {
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              if (prop === 'fetch' && descriptor && typeof descriptor === 'object') {
                if (descriptor.get && !descriptor.set) {
                  var origGet = descriptor.get;
                  var customVal;
                  var hasCustom = false;
                  descriptor.get = function() {
                    return hasCustom ? customVal : origGet.call(this);
                  };
                  descriptor.set = function(val) {
                    customVal = val;
                    hasCustom = true;
                  };
                  descriptor.configurable = true;
                }
              }
            } catch (_) {}
            return origDefineProperty.call(Object, obj, prop, descriptor);
          };
        } catch (_) {}

        // Ensure window.fetch currently has a setter
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = currentFetch;
          origDefineProperty.call(Object, window, 'fetch', {
            get: function() { return activeFetch; },
            set: function(fn) { activeFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              origDefineProperty.call(Object, Window.prototype, 'fetch', {
                get: function() { return activeFetch; },
                set: function(fn) { activeFetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        }

        // Global error trap to suppress the specific harmless getter error if thrown by external iframe scripts
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            event.message.indexOf('fetch') !== -1 &&
            event.message.indexOf('getter') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
